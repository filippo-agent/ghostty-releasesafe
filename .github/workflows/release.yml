name: Release

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (vX.Y.Z). Empty means the latest tag."
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  FEED_URL: https://filippo-agent.github.io/ghostty-releasesafe/appcast.xml
  SPARKLE_VERSION: 2.9.6
  SPARKLE_SHA256: 8d5fb41d960b43f4a68aa14126bf62b098544ec8d191cdcc73eb14e63a8e7606
  CERT_NAME: Ghostty ReleaseSafe (filippo-agent)

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      build: ${{ steps.info.outputs.build }}
      commit: ${{ steps.info.outputs.commit }}
      commit_long: ${{ steps.info.outputs.commit_long }}
    steps:
      - name: Keep the schedule enabled
        # GitHub disables scheduled workflows in repositories without recent
        # activity. Re-enabling the workflow resets that timer.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/enable" ||
            echo "::warning::could not re-enable the workflow"

      - name: Pick the tag to build
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag=$(gh api --paginate 'repos/ghostty-org/ghostty/tags?per_page=100' --jq '.[].name' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid tag: $tag"
            exit 1
          fi
          if [[ -z "$INPUT_TAG" ]] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released"
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Release metadata is computed here rather than in the build job, which
      # runs untrusted code that could rewrite its own outputs.
      - name: Look up the tag
        id: info
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git clone -q --bare --filter=tree:0 https://github.com/ghostty-org/ghostty.git ghostty.git
          commit=$(git -C ghostty.git rev-parse "refs/tags/$TAG^{commit}")
          {
            echo "version=${TAG#v}"
            echo "build=$(git -C ghostty.git rev-list --count "$commit")"
            echo "commit=$(git -C ghostty.git rev-parse --short "$commit")"
            echo "commit_long=$commit"
          } | tee -a "$GITHUB_OUTPUT"

  # The build job runs upstream build scripts and dependencies, so it gets
  # no secrets and a read-only token. Signing and publishing happen in a
  # separate job that only handles the built app bundle.
  build:
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout Ghostty
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ghostty-org/ghostty
          ref: ${{ needs.check.outputs.commit_long }}
          persist-credentials: false

      - name: Select Xcode
        # Use the Xcode version from upstream's own release workflow for
        # this tag, so that toolchain bumps are picked up automatically.
        run: |
          set -euo pipefail
          xcode=$(grep -oE '/Applications/Xcode_[0-9.]+\.app' .github/workflows/release-tag.yml | head -n 1)
          echo "upstream uses $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: true

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          skipPush: true

      - name: Point the updater at this repository's feed
        run: |
          set -euo pipefail
          f=macos/Sources/Features/Update/UpdateDelegate.swift
          grep -q 'https://release.files.ghostty.org/appcast.xml' "$f"
          grep -q 'https://tip.files.ghostty.org/appcast.xml' "$f"
          sed -i '' \
            -e "s|https://release.files.ghostty.org/appcast.xml|$FEED_URL|" \
            -e "s|https://tip.files.ghostty.org/appcast.xml|$FEED_URL|" \
            "$f"
          if grep -rn 'files.ghostty.org/appcast' macos/Sources; then
            echo "::error::upstream feed URL still present"
            exit 1
          fi

      - name: Build GhosttyKit (ReleaseSafe)
        run: |
          nix develop -c zig build \
            -Doptimize=ReleaseSafe \
            -Demit-macos-app=false \
            -Dversion-string="$VERSION"

      - name: Build Ghostty.app
        run: |
          cd macos
          xcodebuild -target Ghostty -configuration Release

      - name: Check build mode
        run: |
          set -euo pipefail
          macos/build/Release/Ghostty.app/Contents/MacOS/ghostty +version | tee version.txt
          grep -qE '^ *- build mode *: \.safe$' version.txt

      - name: Archive app
        run: |
          ditto -c -k --keepParent macos/build/Release/Ghostty.app Ghostty-unsigned.zip
          cp macos/Ghostty.entitlements Ghostty.entitlements

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: |
            Ghostty-unsigned.zip
            Ghostty.entitlements
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      BUILD: ${{ needs.check.outputs.build }}
      COMMIT: ${{ needs.check.outputs.commit }}
      COMMIT_LONG: ${{ needs.check.outputs.commit_long }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: self
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: unsigned

      - name: Unpack app
        # The artifact comes from the build job, which runs untrusted code.
        # Extract it into its own directory, away from the trusted checkout
        # and tools, with bsdtar, which refuses ".." and writing through
        # symlinks. Then reject symlinks that leave the bundle, so that later
        # steps only touch files inside it.
        run: |
          set -euo pipefail
          mkdir app
          /usr/bin/tar -xf unsigned/Ghostty-unsigned.zip -C app --mac-metadata --no-same-owner
          if [[ "$(ls -A app)" != Ghostty.app || -L app/Ghostty.app ]]; then
            echo "::error::the archive must contain only Ghostty.app"
            exit 1
          fi
          root=$(realpath app/Ghostty.app)
          find app/Ghostty.app -type l -print0 | while IFS= read -r -d '' link; do
            if [[ "$(realpath "$link")" != "$root"/* ]]; then
              echo "::error::symlink escapes the bundle: $link"
              exit 1
            fi
          done

      - name: Setup Sparkle tools
        run: |
          set -euo pipefail
          mkdir sparkle
          curl -fsSL -o sparkle/sparkle.zip \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip"
          echo "${SPARKLE_SHA256}  sparkle/sparkle.zip" | shasum -a 256 -c
          unzip -q sparkle/sparkle.zip -d sparkle

      - name: Update Info.plist
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The private key is a base64 Ed25519 seed. Wrap it in PKCS#8 to
          # derive the public key, so the two can never disagree.
          pubkey=$( (printf '302e020100300506032b657004220420' | xxd -r -p; echo "$SPARKLE_PRIVATE_KEY" | base64 -d) |
            openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64)
          echo "Sparkle public key: $pubkey"
          plist=app/Ghostty.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :GhosttyCommit $COMMIT" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $pubkey" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$plist"
          /usr/libexec/PlistBuddy -c "Add :SUFeedURL string $FEED_URL" "$plist"

      - name: Codesign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          rm "$RUNNER_TEMP/cert.p12"

          sign() { /usr/bin/codesign --keychain "$kc" --verbose -f -s "$CERT_NAME" -o runtime "$@"; }
          sparkle=app/Ghostty.app/Contents/Frameworks/Sparkle.framework
          sign "$sparkle/Versions/B/XPCServices/Downloader.xpc"
          sign "$sparkle/Versions/B/XPCServices/Installer.xpc"
          sign "$sparkle/Versions/B/Autoupdate"
          sign "$sparkle/Versions/B/Updater.app"
          sign "$sparkle"
          sign app/Ghostty.app/Contents/PlugIns/DockTilePlugin.plugin
          sign --entitlements unsigned/Ghostty.entitlements app/Ghostty.app

          /usr/bin/codesign --verify --deep --strict --verbose=2 app/Ghostty.app
          /usr/bin/codesign -d -r- app/Ghostty.app 2>&1 | tee requirement.txt
          grep -q 'certificate leaf = H"' requirement.txt
          security delete-keychain "$kc"

      - name: Archive and sign update
        id: archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          zip="Ghostty-${VERSION}-ReleaseSafe.zip"
          ditto -c -k --sequesterRsrc --keepParent app/Ghostty.app "$zip"
          echo "$SPARKLE_PRIVATE_KEY" | sparkle/bin/sign_update --ed-key-file - "$zip" | tee sign_update.txt
          sig=$(echo "$SPARKLE_PRIVATE_KEY" | sparkle/bin/sign_update --ed-key-file - -p "$zip")
          echo "$SPARKLE_PRIVATE_KEY" | sparkle/bin/sign_update --ed-key-file - --verify "$zip" "$sig"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.archive.outputs.zip }}
        run: |
          set -euo pipefail
          notes="Ghostty ${TAG} built with \`-Doptimize=ReleaseSafe\` from [${COMMIT}](https://github.com/ghostty-org/ghostty/commit/${COMMIT_LONG}).

          Upstream release notes: https://ghostty.org/docs/install/release-notes/${VERSION//./-}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ZIP" -R "$GITHUB_REPOSITORY" \
              --title "Ghostty ${VERSION} (ReleaseSafe)" --notes "$notes"
          fi

      - name: Update appcast
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.archive.outputs.zip }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" pages
          export DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          python3 -I self/appcast.py sign_update.txt app/Ghostty.app/Contents/Info.plist pages/appcast.xml
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "appcast: Ghostty ${VERSION} (build ${BUILD})"
          git push origin gh-pages
